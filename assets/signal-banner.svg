<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shahariar Rahman Shanto — animated developer profile banner</title>
  <desc id="desc">A dark futuristic developer dashboard with animated data streams, orbiting particles, and connected technology nodes.</desc>

  <defs>
    <linearGradient id="background" x1="40" y1="0" x2="1160" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F17"/>
      <stop offset="0.5" stop-color="#101722"/>
      <stop offset="1" stop-color="#0D141E"/>
    </linearGradient>
    <linearGradient id="headline" x1="70" y1="112" x2="650" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F5F9"/>
      <stop offset="0.52" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="80" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#2DD4BF"/>
      <stop offset="0.82" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(902 200) rotate(90) scale(225)">
      <stop stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 65) rotate(90) scale(190 360)">
      <stop stop-color="#14B8A6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38BDF8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect width="1200" height="430" rx="26"/></clipPath>
    <path id="orbitOne" d="M 745 202 A 155 155 0 1 0 1055 202 A 155 155 0 1 0 745 202"/>
    <path id="orbitTwo" d="M 785 202 A 115 115 0 1 0 1015 202 A 115 115 0 1 0 785 202"/>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="430" fill="url(#background)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <rect width="1200" height="430" fill="url(#blueGlow)"/>
    <rect width="760" height="300" fill="url(#ambientGlow)"/>

    <rect x="-220" y="0" width="180" height="430" fill="url(#accentLine)" opacity="0.08" transform="skewX(-14)">
      <animate attributeName="x" values="-260;1380" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g stroke-linecap="round">
      <path d="M0 48H390L430 88H650" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="5 10">
        <animate attributeName="stroke-dashoffset" values="0;-120" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M1200 376H1040L1005 341H700" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="4 11">
        <animate attributeName="stroke-dashoffset" values="0;120" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M610 0V38L652 80V132" stroke="#2DD4BF" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 9">
        <animate attributeName="stroke-dashoffset" values="0;-72" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#C5D4DF">
      <circle cx="54" cy="72" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="188" cy="38" r="1.2"><animate attributeName="opacity" values=".25;.85;.25" dur="4.8s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="344" cy="67" r="1.5"><animate attributeName="opacity" values=".15;.9;.15" dur="3.9s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="592" cy="36" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="5.3s" begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle cx="696" cy="352" r="1.4"><animate attributeName="opacity" values=".2;.9;.2" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="68" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="3.6s" begin="-2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="318" r="1.2"><animate attributeName="opacity" values=".2;.8;.2" dur="4.5s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="392" r="1.3"><animate attributeName="opacity" values=".1;.9;.1" dur="5s" begin="-2.7s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="Segoe UI, Inter, Arial, sans-serif">
      <g transform="translate(74 57)">
        <rect width="206" height="30" rx="15" fill="#10252A" stroke="#1E665E"/>
        <circle cx="17" cy="15" r="5" fill="#34D399" filter="url(#glow)">
          <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4.2;5.5;4.2" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="32" y="20" fill="#A7F3D0" font-size="12" font-weight="600" letter-spacing="1.4">AVAILABLE TO BUILD</text>
      </g>

      <text x="72" y="143" fill="#94A3B8" font-size="17" font-weight="600" letter-spacing="5">HELLO, I'M</text>
      <text x="68" y="197" fill="url(#headline)" font-size="50" font-weight="800" letter-spacing="1">SHAHARIAR RAHMAN</text>
      <text x="70" y="245" fill="#F1F5F9" font-size="43" font-weight="300" letter-spacing="11">SHANTO</text>
      <rect x="72" y="268" width="520" height="2" rx="1" fill="url(#accentLine)"/>
      <text x="72" y="305" fill="#CBD5E1" font-size="18" font-weight="500">Computer Science Undergraduate <tspan fill="#475569">//</tspan> BUET</text>

      <g transform="translate(72 333)">
        <rect width="562" height="65" rx="12" fill="#0B0F17" fill-opacity="0.72" stroke="#273A4D"/>
        <circle cx="19" cy="17" r="4" fill="#F87171"/><circle cx="33" cy="17" r="4" fill="#FBBF24"/><circle cx="47" cy="17" r="4" fill="#34D399"/>
        <text x="20" y="47" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="14">~ $</text>
        <text x="58" y="47" fill="#CBD5E1" font-family="Consolas, 'Courier New', monospace" font-size="14">engineering ideas into reliable software</text>
        <rect x="397" y="34" width="8" height="17" rx="1" fill="#2DD4BF">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.15s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g font-family="Segoe UI, Inter, Arial, sans-serif">
      <circle cx="900" cy="202" r="156" stroke="#38BDF8" stroke-opacity="0.15" stroke-dasharray="5 11" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="0 900 202" to="360 900 202" dur="55s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="202" r="116" stroke="#2DD4BF" stroke-opacity="0.2" stroke-dasharray="2 8" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="360 900 202" to="0 900 202" dur="34s" repeatCount="indefinite"/>
      </circle>

      <g stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2">
        <path d="M900 202L900 80"/><path d="M900 202L1045 130"/><path d="M900 202L1048 286"/>
        <path d="M900 202L900 346"/><path d="M900 202L755 282"/><path d="M900 202L758 127"/>
      </g>
      <g fill="#38BDF8" filter="url(#glow)">
        <circle r="3" fill="#38BDF8"><animateMotion dur="3.4s" repeatCount="indefinite" path="M900 202L900 80"/></circle>
        <circle r="3" fill="#F59E0B"><animateMotion dur="4.1s" begin="-1.5s" repeatCount="indefinite" path="M900 202L1045 130"/></circle>
        <circle r="3" fill="#2DD4BF"><animateMotion dur="3.8s" begin="-.7s" repeatCount="indefinite" path="M900 202L1048 286"/></circle>
        <circle r="3" fill="#FB7185"><animateMotion dur="4.3s" begin="-2.1s" repeatCount="indefinite" path="M900 202L900 346"/></circle>
        <circle r="3" fill="#F59E0B"><animateMotion dur="3.7s" begin="-1.2s" repeatCount="indefinite" path="M900 202L755 282"/></circle>
        <circle r="3" fill="#38BDF8"><animateMotion dur="4s" begin="-2.5s" repeatCount="indefinite" path="M900 202L758 127"/></circle>
      </g>

      <circle r="4" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orbitOne"/></animateMotion></circle>
      <circle r="3" fill="#2DD4BF" filter="url(#glow)"><animateMotion dur="7s" begin="-3s" repeatCount="indefinite"><mpath href="#orbitTwo"/></animateMotion></circle>

      <circle cx="900" cy="202" r="70" fill="#101923" stroke="#38BDF8" stroke-opacity="0.66" stroke-width="1.5"/>
      <circle cx="900" cy="202" r="55" fill="none" stroke="#2DD4BF" stroke-opacity="0.36" stroke-dasharray="4 7">
        <animateTransform attributeName="transform" type="rotate" from="0 900 202" to="360 900 202" dur="18s" repeatCount="indefinite"/>
      </circle>
      <text x="900" y="198" text-anchor="middle" fill="#E7EEF3" font-family="Consolas, 'Courier New', monospace" font-size="31" font-weight="700">&lt;/&gt;</text>
      <text x="900" y="223" text-anchor="middle" fill="#5EEAD4" font-size="10" font-weight="700" letter-spacing="2.2">BUILD MODE</text>

      <g text-anchor="middle" font-size="12" font-weight="700">
        <g transform="translate(900 80)"><circle r="27" fill="#111A24" stroke="#38BDF8" stroke-opacity=".7"/><text y="4" fill="#BAE6FD">C++</text></g>
        <g transform="translate(1045 130)"><circle r="27" fill="#111A24" stroke="#F59E0B" stroke-opacity=".7"/><text y="4" fill="#FDE68A">JAVA</text></g>
        <g transform="translate(1048 286)"><circle r="27" fill="#111A24" stroke="#2DD4BF" stroke-opacity=".7"/><text y="4" fill="#99F6E4">API</text></g>
        <g transform="translate(900 346)"><circle r="27" fill="#111A24" stroke="#FB7185" stroke-opacity=".7"/><text y="4" fill="#FECDD3">DB</text></g>
        <g transform="translate(755 282)"><circle r="27" fill="#111A24" stroke="#F59E0B" stroke-opacity=".7"/><text y="4" fill="#FDE68A">AI</text></g>
        <g transform="translate(758 127)"><circle r="27" fill="#111A24" stroke="#38BDF8" stroke-opacity=".7"/><text y="4" fill="#BAE6FD">PY</text></g>
      </g>
    </g>

    <rect x="1" y="1" width="1198" height="428" rx="25" stroke="url(#accentLine)" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
