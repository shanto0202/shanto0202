<svg width="1200" height="42" viewBox="0 0 1200 42" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated signal divider</title>
  <desc id="desc">Blue, teal, amber, and coral signals travel across a thin circuit line.</desc>
  <defs>
    <linearGradient id="signal" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".18" stop-color="#38BDF8"/>
      <stop offset=".45" stop-color="#2DD4BF"/>
      <stop offset=".72" stop-color="#F59E0B"/>
      <stop offset=".9" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="route" d="M70 21H1130"/>
  </defs>

  <path d="M70 21H1130" stroke="#334155" stroke-opacity=".34"/>
  <path d="M70 21H1130" stroke="url(#signal)" stroke-width="1.5" stroke-dasharray="3 12">
    <animate attributeName="stroke-dashoffset" values="0;-90" dur="5s" repeatCount="indefinite"/>
  </path>

  <g stroke="#475569" stroke-opacity=".55">
    <path d="M240 16V26"/><path d="M480 16V26"/><path d="M720 16V26"/><path d="M960 16V26"/>
  </g>

  <circle r="4" fill="#38BDF8" filter="url(#glow)">
    <animateMotion dur="5.8s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    <animate attributeName="fill" values="#38BDF8;#2DD4BF;#F59E0B;#FB7185" dur="5.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#F59E0B" filter="url(#glow)">
    <animateMotion dur="7.2s" begin="-3.6s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    <animate attributeName="fill" values="#F59E0B;#FB7185;#38BDF8;#2DD4BF" dur="7.2s" repeatCount="indefinite"/>
  </circle>
</svg>
