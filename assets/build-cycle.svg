<svg width="1200" height="210" viewBox="0 0 1200 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated engineering build cycle</title>
  <desc id="desc">A glowing signal travels through idea, design, build, test, and ship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/><stop offset=".5" stop-color="#071426"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rail" x1="110" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="route" d="M118 92H1082"/>
  </defs>

  <rect width="1200" height="210" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="208" rx="21" stroke="#164E63" stroke-opacity=".65"/>
  <text x="600" y="34" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3">HOW I TURN A PROBLEM INTO A PRODUCT</text>

  <path d="M118 92H1082" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <path d="M118 92H1082" stroke="url(#rail)" stroke-opacity=".42" stroke-width="2" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="4s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(118 92)">
      <circle r="31" fill="#071827" stroke="#22D3EE" stroke-opacity=".75"/>
      <path d="M-8-2a8 8 0 1116 0c0 4-3 6-5 8v4H-3V6c-2-2-5-4-5-8zM-3 15h6" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
      <text y="60" fill="#E2E8F0" font-size="13" font-weight="700">IDEA</text><text y="79" fill="#64748B" font-size="10">understand</text>
    </g>
    <g transform="translate(359 92)">
      <circle r="31" fill="#0B1629" stroke="#38BDF8" stroke-opacity=".7"/>
      <path d="M-12 8L0-13 12 8M-8 2H8M0-13V13" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" fill="#E2E8F0" font-size="13" font-weight="700">DESIGN</text><text y="79" fill="#64748B" font-size="10">architect</text>
    </g>
    <g transform="translate(600 92)">
      <circle r="34" fill="#10152B" stroke="#818CF8" stroke-opacity=".78"/>
      <text y="7" fill="#C4B5FD" font-family="Consolas, monospace" font-size="22" font-weight="700">&lt;/&gt;</text>
      <text y="60" fill="#E2E8F0" font-size="13" font-weight="700">BUILD</text><text y="79" fill="#64748B" font-size="10">implement</text>
    </g>
    <g transform="translate(841 92)">
      <circle r="31" fill="#0B1B28" stroke="#2DD4BF" stroke-opacity=".7"/>
      <path d="M-11 1L-3 9 13-10" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" fill="#E2E8F0" font-size="13" font-weight="700">TEST</text><text y="79" fill="#64748B" font-size="10">validate</text>
    </g>
    <g transform="translate(1082 92)">
      <circle r="31" fill="#081E20" stroke="#34D399" stroke-opacity=".78"/>
      <path d="M-12 8L13-12 6 13 0 4-12 8zM0 4L13-12" stroke="#6EE7B7" stroke-width="2" stroke-linejoin="round"/>
      <text y="60" fill="#E2E8F0" font-size="13" font-weight="700">SHIP</text><text y="79" fill="#64748B" font-size="10">improve</text>
    </g>
  </g>

  <circle r="7" fill="#F8FAFC" filter="url(#glow)">
    <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#route"/></animateMotion>
    <animate attributeName="fill" values="#22D3EE;#818CF8;#34D399" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="13" fill="none" stroke="#67E8F9" stroke-opacity=".5">
    <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#route"/></animateMotion>
    <animate attributeName="r" values="7;15;7" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;.15;.8" dur="1.1s" repeatCount="indefinite"/>
  </circle>
</svg>
